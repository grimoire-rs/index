# GitLab CI for self-hosted index forks. Inert on GitHub (the GitHub
# workflows in .github/ are the mirror-image and inert on GitLab).
#
# Deliberately a thin include: the job logic lives in a file
# `@grimoire-rs/indexer` owns, so upgrades arrive by bumping the pinned ref
# in the URL below instead of editing jobs here. It ships two jobs —
# `grim-indexer:validate` (MR pipelines: path, ownership, schema and
# registry-reachability checks) and `pages` (default branch: enrich from
# the registry, compile, publish GitLab Pages).
#
# If your GitLab instance blocks remote includes, vendor the file locally
# and switch to `- local: "ci/grim-indexer.yml"`.
#
# The gate's exit code is the decision: 0 = eligible for auto-merge,
# non-zero = manual review. GitLab has no equivalent of the GitHub
# `needs:`-guarded merge job here, because an MR supplies its own
# `.gitlab-ci.yml` and could simply delete it — enforce the merge policy
# instance-side (required merge check, protected branch, approval rules).
#
# No CI/CD variables are required. The enrichment step reads the public
# registry anonymously and commits nothing; set `GRIM_INDEXER_ENRICH` to
# "false" for a pointers-only site.
include:
  - remote: "https://raw.githubusercontent.com/grimoire-rs/indexer/v0.2.1/templates/reusable/gitlab-index-ci.yml"

variables:
  GRIM_INDEXER_VERSION: "0.2.1"
