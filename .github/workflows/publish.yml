name: publish

# Builds this index and deploys it to GitHub Pages.
#
# Deliberately a thin caller: the job logic lives in a reusable workflow
# `@grimoire-rs/indexer` owns, so a fix there reaches this repo by bumping
# the pinned ref below rather than by editing steps here.

on:
  push:
    branches: [main]
  # Auto-merges land via GITHUB_TOKEN, whose pushes do not retrigger
  # push workflows — validate-pr dispatches this workflow explicitly.
  workflow_dispatch:
  # Daily refresh. Also what keeps package READMEs, logos and version lists
  # current: the called workflow enriches from the live registry on every
  # build, so a release published since the last deploy shows up here.
  schedule:
    - cron: "17 4 * * *"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # Announce forks inherit this cron but have no Pages site — skip there.
    if: github.repository == 'grimoire-rs/index'
    uses: grimoire-rs/indexer/.github/workflows/index-pages.yml@v0.2.1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      grim-indexer-version: "0.2.1"
