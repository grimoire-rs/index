# Generated by @grimoire-rs/indexer - DO NOT EDIT.
#
# This file is rendered from the `ci` block of index.config.json and committed
# to this repository, which owns and runs it. To change what CI does, change
# the config and re-render:
#
#     npm run ci
#
# The version that renders it is the one in package-lock.json, so CI runs
# `npm ci` and never fetches a floating release. Bump the dependency the
# ordinary npm way, then re-render.
#
# The `verify-ci` job re-renders and diffs on every push and pull request, so a
# hand-edit fails CI rather than silently forking. Action pins are excluded
# from that diff - Renovate may bump `uses: owner/action@<ref>` freely.
#
# To own these files by hand instead, set `"allowManualEdits": true` in the
# `ci` block: the guard is then not emitted, and CI fixes stop arriving by
# re-render.

# Builds this index and deploys it to GitHub Pages.
#
# Enable it once, in Settings -> Pages -> Source: "GitHub Actions". Until
# that is set, this workflow runs green and deploys nothing.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Start a new build-state epoch: discard the cached blobs and enrich every artifact again"
        type: boolean
        default: false
      purge:
        description: "Drop one artifact from the carried-forward state: a registry reference, or a sha256 digest"
        type: string
        default: ""

# Default-deny at the top; every job pays for exactly what it needs.
permissions: {}

concurrency:
  group: grim-indexer-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    needs: stats
    if: always()
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one job that restores and saves the Actions cache, so a build only
      # ever restores what an earlier build saved. No other job here caches.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # `npm ci` installs exactly package-lock.json, so which renderer builds
      # this site is a reviewed fact in the repository, not a resolution that
      # happens on the runner. `--ignore-scripts` because this job runs
      # MERGED contributor content: a `prepare` script or a lock entry that
      # arrived through an auto-merged pull request would otherwise execute
      # here, in the job that publishes the site.
      - name: Install
        run: npm ci --ignore-scripts

      # Ahead of the build, not after it: it only resolves this repository's
      # Pages URL and sets outputs, and a step that runs before the build - the
      # stats seed - cross-checks `site` against that URL before it reads the
      # published sidecar.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # What the last deploy learned about each artifact lives in a blob store,
      # restored here so a run does not start cold. Only the default branch
      # touches it, here and at the save. The restore asks for exactly
      # the key `state-key` prints for the plane that deploy published, with no
      # fallback key. `npx --no` because `package.json` is the repository's own
      # file and may predate the command.
      #
      # The key must match the grammar as one whole string before it reaches
      # `GITHUB_OUTPUT`. A line-oriented grep would admit `1-<digest>` plus a
      # second line, and that line would become a second output. Anything
      # else leaves the output unset: a cold build, nothing restored or saved.
      - name: Read the build-state key
        id: state-key
        if: github.ref == 'refs/heads/main'
        run: |
          re='^[0-9]{1,16}-[0-9a-f]{64}$'
          if key=$(npx --no grim-indexer state-key) && [[ "$key" =~ $re ]]; then
            echo "key=$key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no usable build-state key - building cold, nothing restored or saved"
          fi

      # The cache service matches the key by prefix, so a restore can fill the
      # blob store from an entry nobody named and report `cache-hit: false`.
      # The next step empties it unless the hit was exact, so only the entry
      # `state-key` named is ever read. A bad entry is retired with
      # `gh cache delete <key>`; the run after it builds cold.
      - name: Restore the build state
        id: state-restore
        if: github.ref == 'refs/heads/main' && steps.state-key.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .grim-index-state/b
          key: grim-index-state-v1-${{ steps.state-key.outputs.key }}

      - name: Drop a restored state that was not asked for
        id: state-restore-clean
        if: github.ref == 'refs/heads/main' && steps.state-key.outputs.key != '' && steps.state-restore.outputs.cache-hit != 'true'
        run: rm -rf -- .grim-index-state/b

      # The index stores pointers; everything a reader looks at - README,
      # changelog, logo, version list - lives in the registry, and grim is
      # what reads a registry. `ci.grimVersion` pins the binary.
      - name: Install grim
        env:
          # Resolved from `ci.grimVersion` when this file was rendered, so
          # there is no version branch left to take at run time.
          GRIM_RELEASE_BASE: "https://github.com/grimoire-rs/grimoire/releases/latest/download"
        run: |
          set -euo pipefail
          tarball="grimoire-$(uname -m)-unknown-linux-gnu.tar.gz"
          cd "$(mktemp -d)"
          curl -fsSL --proto '=https' --tlsv1.2 \
            -O "${GRIM_RELEASE_BASE}/${tarball}" -O "${GRIM_RELEASE_BASE}/${tarball}.sha256"
          sha256sum -c "${tarball}.sha256"
          tar -xzf "${tarball}" --strip-components=1 --wildcards -C /usr/local/bin '*/grim'
          grim --version

      # Enrichment is best-effort by design: a registry outage must degrade
      # the site to pointers-only, never block a deploy that is otherwise
      # ready. `enrich` itself keeps any sidecar it fails to refresh. Set
      # `"enrich": false` in the `ci` block to drop these steps entirely.
      #
      # `--seed` starts from the state the last deploy published: it reads
      # `<site>/c/root.json` and the enrich plane that root names. Nothing is
      # committed here, so without it this job starts from an empty tree every
      # run: every digest probe compares against nothing, every README and
      # payload is downloaded again, and every artifact without a `created` of
      # its own is re-dated to this build. A root that cannot be read is a
      # warning, not a failure; the run just does the full download it used to
      # do.
      - name: Refresh package metadata
        env:
          # The ceiling of this job in seconds, in the variable GitLab sets for
          # its own jobs: the refresh budgets its time against it.
          CI_JOB_TIMEOUT: 7200
          # Dispatch inputs reach the script through the environment only. An
          # input spliced into `run:` would be shell the dispatcher writes.
          GRIM_INDEX_FRESH: ${{ inputs.fresh }}
          GRIM_INDEX_PURGE: ${{ inputs.purge }}
        run: |
          set -- --seed
          strict=
          if [ -n "${GRIM_INDEX_PURGE:-}" ]; then set -- "$@" "--purge=$GRIM_INDEX_PURGE"; strict=1; fi
          if [ "${GRIM_INDEX_FRESH:-}" = true ]; then set -- "$@" --fresh; strict=1; fi
          rc=0
          npm run enrich -- "$@" || rc=$?
          if [ "$rc" -eq 65 ] && [ -n "$strict" ]; then
            echo "enrich rejected --purge or --fresh (exit 65)" >&2
            exit 65
          fi
          [ "$rc" -eq 0 ] || echo "::warning::enrich exited $rc - building from the carried-forward state"

      # The key of the state that run handed off, read on the default branch
      # only because only that branch saves. Same admission rule as above.
      - name: Read the key of the handed-off state
        id: state-next
        if: steps.state-key.outputs.key != '' && github.ref == 'refs/heads/main'
        run: |
          re='^[0-9]{1,16}-[0-9a-f]{64}$'
          if key=$(npx --no grim-indexer state-key --next) && [[ "$key" =~ $re ]]; then
            echo "key=$key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no usable key for the handed-off state - it will not be saved"
          fi

      # Saving is skipped when an entry already exists under that key, which
      # is the common case once a deploy has published the state it saved.
      - name: Look for a saved entry
        id: state-lookup
        if: github.ref == 'refs/heads/main' && steps.state-next.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .grim-index-state/b
          key: grim-index-state-v1-${{ steps.state-next.outputs.key }}
          lookup-only: true

      # Invariant R-2 lives in these two steps and in their order.
      #
      # A completed `stats` job has already merged itself over this same
      # published copy, per stat key, so it wins outright. Only when there is no
      # fresh document does the published copy get carried forward untouched -
      # which is exactly what must happen when the `stats` job failed, was
      # skipped, or was never enabled on this run.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        # A failed or skipped `stats` job produced no artifact. That must not
        # fail the deploy: carrying the published sidecar forward is the point.
        continue-on-error: true
        with:
          name: grim-stats

      # The indexer reads the published sidecar, through the root the live site
      # publishes. Fetching `stats.json` here would read a 404 on a site that no
      # longer serves one (`sync.legacy: false`) as the first run, and deploy with
      # every rating gone. An unreadable root, a missing or mismatching blob and
      # a document that does not parse all fail the job: `|| true` is forbidden,
      # since it cannot tell a genuine first run from a wipe.
      - name: Seed from the published sidecar
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail

          # One source. The seed URL is `site` from index.config.json, read
          # out of the checkout here - the same key, the same file and the
          # same run as the job that produced the artifact above. Not baked
          # in at render time on purpose: a workflow rendered before `site`
          # was last edited would seed from one URL while the collectors read
          # the other, which is the divergence this step exists to close.
          SITE_URL=$(node -p 'JSON.parse(require("fs").readFileSync("index.config.json","utf8")).site ?? ""')
          rstrip() { u=$1; while [ "${u%/}" != "$u" ]; do u=${u%/}; done; printf '%s' "$u"; }
          SITE_URL=$(rstrip "$SITE_URL")
          case "$SITE_URL" in
            https://*) ;;
            # Not defaulted: the built-in default names the first-party index,
            # and seeding from someone else's published stats would merge
            # their stats into this one's sidecar. TLS because the fetched
            # document decides every published stat.
            *) echo "::error::index.config.json needs an explicit https \`site\` - the seed is read from the stats <site> publishes (got '$SITE_URL')"; exit 1 ;;
          esac

          # The Pages URL is a cross-check, never a second source: while it was
          # the source, this step fetched one URL and the collectors fetched the
          # other, and a 404 there is a legal empty seed - so a disagreement
          # published a sidecar built from nothing, at exit 0.
          #
          # Absent is not a disagreement: a fork, or a deploy that is not
          # Pages, has no such URL, and `site` stands alone. Neither is a
          # trailing slash, the scheme, or host case - hostnames are
          # case-insensitive where the path is not. A real disagreement fails
          # ahead of the freshness check below: the collectors read `site` too,
          # so a fresh artifact is no evidence that this URL is the right one.
          lower() { u=${1#*://}; h=${u%%/*}; printf '%s%s' "${h,,}" "${u#"$h"}"; }
          if [ -n "${PAGES_URL:-}" ] && [ "$(lower "$(rstrip "$PAGES_URL")")" != "$(lower "$SITE_URL")" ]; then
            echo "::error::index.config.json publishes to $SITE_URL but this pipeline deploys $PAGES_URL - the seed would be read from one and the sidecar published to the other"
            exit 1
          fi

          if [ -f .stats.json ]; then
            echo "using the stats document this run produced"
            exit 0
          fi
          npx --no grim-indexer stats-seed
      - name: Build index
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      # The one place the build state is written. Last in the job so a failed
      # build saves nothing, and on the default branch only: a pull request or
      # a dispatch from another branch must not seed what the next deploy
      # restores. `success()` is spelled out and no status override is
      # allowed here, so a half-finished run never replaces a good entry. The
      # key names the content, so an entry is written once; the lookup step
      # skips the upload when one already exists.
      - name: Save the build state
        if: success() && github.ref == 'refs/heads/main' && steps.state-next.outputs.key != '' && steps.state-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .grim-index-state/b
          key: grim-index-state-v1-${{ steps.state-next.outputs.key }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The Actions cache is for `build` alone.
    cache-mode: none
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The same URL, handed to `probe`.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Warns when the live site answers with a content type browsers reject. The run
  # stays green: `probe` exits 0 on anything it finds and `continue-on-error`
  # covers a lock that predates it. `timeout-minutes` is load-bearing: the
  # concurrency group is held until every job ends, so a hung probe would
  # queue the next deploy behind it.
  probe:
    needs: deploy
    runs-on: ubuntu-latest
    # The Actions cache is for `build` alone.
    cache-mode: none
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `cache: npm`: `build` is the one job that saves the Actions cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install
        run: npm ci --ignore-scripts

      # The URL arrives through the environment and is quoted, never spliced
      # into the script. `npx --no` runs the copy package-lock.json pins and
      # never fetches one, so a lock that predates `probe` fails this job only.
      - name: Probe the deployed site
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx --no grim-indexer probe "$SITE_URL"

  # Collects every signal `stats.json` carries into `.stats.json` - the sidecar
  # `build` joins onto the catalog and the deploy publishes beside all.json.
  #
  # Its own job, ahead of `build`, because `build` has to run even when this
  # one fails. A collector that cannot reach its backend must never empty a
  # published stat (R-2), and the only way to keep the previous one is to
  # deploy without a fresh one - see the seed step in `build`.
  #
  # ONE job for every collector, not one job each, and that is correctness
  # rather than thrift: each collector writes a WHOLE fresh document seeded
  # from the published one, so two jobs both seeding from the published copy
  # would each drop the other's key, and `build` downloads exactly one
  # artifact anyway. Here they run in series in one shell and each seeds from
  # the file the one before it left.
  #
  # Turn a collector off by deleting its block from index.config.json and
  # re-rendering. That stops the collection, but the last one stays published:
  # deleting `stats.json` from the deploy is the other half of the rollback.
  stats:
    runs-on: ubuntu-latest
    # The Actions cache is for `build` alone.
    cache-mode: none
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `cache: npm`: `build` in pages.yml is the one job that saves the
      # Actions cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install
        run: npm ci --ignore-scripts

      # `npx --no` refuses to fetch anything `npm ci` did not install, so the
      # renderer that tallies is the one package-lock.json pins - the same
      # reviewed-fact rule every other job here follows. Spelled as `npx`
      # rather than an npm script so an index scaffolded before ratings existed
      # turns them on by re-rendering CI, with no package.json edit.
      - name: Tally ratings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no grim-indexer ratings

      # `error` rather than the default warning: a run that reported success
      # and wrote nothing is a bug, and the failure mode it would otherwise
      # produce - `build` silently falling back to the seed - looks exactly
      # like a healthy carry-forward.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: grim-stats
          path: .stats.json
          # `.stats.json` is a dotfile, and upload-artifact skips hidden files
          # unless told otherwise. Without this the job succeeds, uploads
          # nothing, and `build` carries the seed forward - a wipe that reads
          # as a healthy deploy, which is exactly what R-2 exists to prevent.
          include-hidden-files: true
          if-no-files-found: error
