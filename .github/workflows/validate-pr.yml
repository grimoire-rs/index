name: validate-pr

# Auto-merge gate for package announcements.
#
# The gate itself is a thin caller of a reusable workflow
# `@grimoire-rs/indexer` owns — it runs `grim-indexer validate` from npm
# against the TRUSTED base checkout and reads the PR head as DATA ONLY,
# never executing, importing or installing anything from it. Its exit code
# is the whole decision: 0 = eligible for auto-merge.
#
# The merge is this repository's policy, not the gate's, so it lives here
# as a separate job. It checks nothing out, so no contributor code ever
# runs with the write token it holds.
#
# NOT covered: an announce this repo's own CI opens. GitHub runs no
# workflows on a PR created with `secrets.GITHUB_TOKEN`, so such a PR is
# effectively ungated and never auto-merges — review it by hand.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    # A PR that touches neither is a maintainer change and gets reviewed by
    # hand — running the gate on it would only ever fail. A PR that touches
    # one of these AND something else still lands here, and still fails:
    # the gate is handed every changed path, not just the matching ones.
    paths:
      - "index/**"
      - "index-policy.json"

permissions: {}

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: grimoire-rs/indexer/.github/workflows/index-validate.yml@v0.2.1
    permissions:
      contents: read
      pull-requests: read
    with:
      grim-indexer-version: "0.2.1"

  # `needs:` is the entire safety condition — this runs only when the gate
  # exited 0, and the gate sees every changed path in the PR, including
  # deletions and anything outside `index/`.
  automerge:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch publish.yml after the merge
    steps:
      - name: Merge and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$REPO" --squash
          # GITHUB_TOKEN pushes skip push-triggered workflows; deploy explicitly.
          gh workflow run publish.yml --repo "$REPO" --ref main
