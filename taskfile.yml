# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Toolchain (task, node/npm, python3) is pinned in ocx.toml. Locally direnv
# supplies PATH via .envrc (`direnv allow`); in CI ocx-sh/setup-ocx does.
# Tasks call binaries directly.

tasks:
  default:
    desc: Run the full verify gate
    cmds:
      - task: verify

  deps:
    desc: Install site npm dependencies (npm ci)
    cmd: npm ci --prefix site
    sources:
      - site/package-lock.json
    generates:
      - site/node_modules/.package-lock.json

  test:
    desc: Offline validator self-checks
    cmds:
      - python3 scripts/test_validate_mr.py
      - node --test site/src/lib/catalog.test.ts

  enrich:
    desc: Refresh enrich/ sidecars from the live registry (online; CI-scheduled)
    cmd: python3 scripts/enrich.py

  build:index:
    desc: Compile index/**/metadata.json into dist/ (all.json + copies)
    cmd: python3 scripts/build.py

  build:site:
    desc: Build the Astro catalog site (site/dist)
    deps: [deps]
    cmd: npm run build --prefix site

  build:
    desc: Full Pages artifact — index JSON + site merged into dist/
    cmds:
      - task: build:index
      - task: build:site
      - cp -a site/dist/. dist/

  serve:
    desc: Build everything and serve dist/ locally (PORT=8080)
    cmds:
      - task: build
      - python3 -m http.server -d dist {{.PORT | default "8080"}}

  dev:
    desc: Astro dev server with hot reload (reads index/ live)
    deps: [deps]
    cmd: npm run dev --prefix site

  verify:
    desc: CI gate — validator self-checks + full artifact build
    cmds:
      - task: test
      - task: build

  # Enforce the DCO term CONTRIBUTING.md promises: every non-merge commit in
  # the range carries a Signed-off-by trailer whose email matches its author.
  # Bot authors are exempt — dependabot cannot sign off, and its commits are
  # not contributions in the DCO sense.
  dco:
    desc: Check Signed-off-by trailers on a commit range (default main..HEAD)
    vars:
      RANGE: '{{.RANGE | default "main..HEAD"}}'
    cmds:
      - |
        missing=0
        for sha in $(git rev-list --no-merges {{.RANGE}}); do
          email=$(git show -s --format='%ae' "$sha")
          name=$(git show -s --format='%an' "$sha")
          case "$name$email" in *'[bot]'*) continue ;; esac
          # -F, not a regex: real addresses carry '+' and '.', both of which
          # are ERE metacharacters. Read trailers only, so a Signed-off-by
          # quoted in a commit body cannot satisfy the check.
          if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qF "<$email>"; then
            echo "missing or mismatched sign-off: $(git show -s --format='%h %s' "$sha")"
            echo "  author: $name <$email>"
            missing=$((missing + 1))
          fi
        done
        if [ "$missing" -gt 0 ]; then
          echo ""
          echo "$missing commit(s) without a matching Signed-off-by trailer."
          echo "Sign off with 'git commit -s', or fix history with"
          echo "  git rebase --signoff {{.RANGE}}"
          echo "See the License section of CONTRIBUTING.md."
          exit 1
        fi
        echo "DCO: all commits in {{.RANGE}} are signed off"

  update:lock:
    desc: Re-resolve tool tags and rewrite ocx.lock
    cmd: ocx lock
