# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Toolchain (task, node/npm, grim) is pinned in ocx.toml. Locally direnv
# supplies PATH via .envrc (`direnv allow`); in CI ocx-sh/setup-ocx does.
#
# The build, the gate and the enrichment all live in @grimoire-rs/indexer.
# Which version runs is package-lock.json's answer and nothing else's — these
# tasks are thin wrappers over the npm scripts, so there is no second pin
# here to drift out of step with it.

tasks:
  default:
    desc: Run the full verify gate
    cmds:
      - task: verify

  install:
    desc: Install the pinned renderer (what CI does with `npm ci`)
    cmd: npm ci

  enrich:
    desc: Refresh enrich/ sidecars from the live registry (online; needs grim)
    cmd: npm run enrich

  build:
    desc: Full Pages artifact — index JSON + site in dist/
    cmd: npm run build

  serve:
    desc: Serve this index locally with live reload
    cmd: npm run dev

  ci:
    desc: Re-render the committed CI from index.config.json
    cmd: npm run ci

  verify:
    desc: CI gate — the committed CI matches the config, and the index builds
    cmds:
      - npm run ci:check
      - task: build

  # Enforce the DCO term CONTRIBUTING.md promises: every non-merge commit in
  # the range carries a Signed-off-by trailer whose email matches its author.
  # Bot authors are exempt — dependabot cannot sign off, and its commits are
  # not contributions in the DCO sense.
  dco:
    desc: Check Signed-off-by trailers on a commit range (default main..HEAD)
    vars:
      RANGE: '{{.RANGE | default "main..HEAD"}}'
    cmds:
      - |
        missing=0
        for sha in $(git rev-list --no-merges {{.RANGE}}); do
          email=$(git show -s --format='%ae' "$sha")
          name=$(git show -s --format='%an' "$sha")
          case "$name$email" in *'[bot]'*) continue ;; esac
          # -F, not a regex: real addresses carry '+' and '.', both of which
          # are ERE metacharacters. Read trailers only, so a Signed-off-by
          # quoted in a commit body cannot satisfy the check.
          if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qF "<$email>"; then
            echo "missing or mismatched sign-off: $(git show -s --format='%h %s' "$sha")"
            echo "  author: $name <$email>"
            missing=$((missing + 1))
          fi
        done
        if [ "$missing" -gt 0 ]; then
          echo ""
          echo "$missing commit(s) without a matching Signed-off-by trailer."
          echo "Sign off with 'git commit -s', or fix history with"
          echo "  git rebase --signoff {{.RANGE}}"
          echo "See the License section of CONTRIBUTING.md."
          exit 1
        fi
        echo "DCO: all commits in {{.RANGE}} are signed off"

  update:lock:
    desc: Re-resolve tool tags and rewrite ocx.lock
    cmd: ocx lock
